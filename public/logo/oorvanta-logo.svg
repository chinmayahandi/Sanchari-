<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <!-- Brand Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Hill (Green - Nature) -->
    <path d="M5 50 Q 25 20, 45 42 Q 55 30, 65 50 Z" fill="#438B54" opacity="0.9" />
    <!-- Foreground Mountain (Teal - Water/Discovery) -->
    <path d="M22 50 Q 38 12, 54 50 Z" fill="#087E8B" />
    <!-- Rising Sun / Journey Glow (Orange) -->
    <circle cx="28" cy="18" r="9" fill="#F28C28" />
    <!-- Flowing River Arc (Teal Light) -->
    <path d="M5 54 C 25 50, 40 58, 65 54" stroke="#087E8B" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Temple/Gopura Pin Top -->
    <path d="M38 12 L 38 7" stroke="#102A43" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="88" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="34" fill="#102A43" letter-spacing="-0.5">Sanchari</text>
  <text x="90" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#087E8B" letter-spacing="1.2">EXPLORE KARNATAKA. YOUR WAY.</text>
</svg>
